<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Willard Maps</title>
    
    <!-- Willard Maps Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='0' y='0' width='32' height='32' rx='9' fill='%23fffd38'/><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%23003314'/><stop offset='100%' style='stop-color:%23fffd38'/></linearGradient></defs><path d='M16 4C11.5 4 8 7.5 8 12c0 6 8 14 8 14s8-8 8-14c0-4.5-3.5-8-8-8z' fill='url(%23g)'/><circle cx='16' cy='12' r='3.2' fill='black'/></svg>">    
    <!-- Pannellum Core CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --willard-green: #003314;
            --willard-yellow: #fffd38;
            --glass-bg: rgba(15, 15, 15, 0.45);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
        }

        /* --- PANORAMA BASE --- */
        #panorama-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .pnlm-compass {
            right: 20px !important;
            bottom: 20px !important;
            color: var(--willard-yellow) !important;
            z-index: 10;
        }

        /* --- LIQUID GLASS SEARCH UI --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none; /* Let clicks pass through to map */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        

        .search-container {
            position: relative;
            margin-top: 40px;
            width: 90%;
            max-width: 450px;
            pointer-events: auto; /* Re-enable clicks for search bar */
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* The shifting gradient border wrapper */
        .search-gradient-wrapper {
            position: relative;
            border-radius: 50px;
            padding: 2px; /* Thickness of the gradient border */
            background: linear-gradient(90deg, var(--willard-green), var(--willard-yellow), var(--willard-green), var(--willard-yellow));
            background-size: 300% 300%;
            animation: shiftGradient 4s linear infinite;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 253, 56, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .search-gradient-wrapper:focus-within {
            transform: scale(1.02);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 253, 56, 0.4);
        }

        @keyframes shiftGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* The actual liquid glass pill */
        .search-pill {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 12px 20px;
            height: 60px;
            box-sizing: border-box;
        }

        .search-icon {
            width: 24px;
            height: 24px;
            fill: var(--willard-yellow);
            margin-right: 15px;
            flex-shrink: 0;
        }

        #search-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 400;
            font-family: var(--font-main);
            width: 100%;
        }

        #search-input::placeholder {
            color: var(--text-muted);
        }

        .mic-icon {
            width: 24px;
            height: 24px;
            fill: var(--text-muted);
            margin-left: 15px;
            cursor: pointer;
            transition: fill 0.3s ease;
        }

        .mic-icon:hover {
            fill: var(--willard-yellow);
        }
        .hud-glass:last-child { display: none; }

        .profile-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            margin-left: 15px;
            background: linear-gradient(135deg, var(--willard-green), var(--willard-yellow));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            flex-shrink: 0;
        }

        /* --- SEARCH RESULTS DROPDOWN --- */
        #search-results {
            position: absolute;
            top: calc(100% + 15px);
            left: 0;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            z-index: 500;
        }

        #search-results.active {
            max-height: 400px;
            opacity: 1;
        }

        .result-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s ease;
            color: var(--text-main);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        /* Add this to your <style> section */
        .hud-glass:first-child { display: none; }

        .result-icon {
            width: 20px;
            height: 20px;
            fill: var(--willard-green);
            margin-right: 15px;
            background: var(--willard-yellow);
            border-radius: 50%;
            padding: 6px;
        }

        .result-details {
            display: flex;
            flex-direction: column;
        }

        .result-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .result-subtitle {
            font-size: 0.8rem;
            color: var(--willard-yellow);
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .no-results {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* --- BOTTOM UI Elements (Google Maps Style) --- */
        .bottom-ui {
            position: absolute;
            bottom: 60px;
            right: 30px;
            pointer-events: auto;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .hud-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 20px;
            box-shadow: var(--glass-shadow);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        .hud-label {
            font-size: 0.65rem;
            color: var(--willard-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .hud-value {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* --- CUSTOM TOOLTIPS (Pannellum) --- */
        .custom-tooltip span {
            visibility: hidden;
            position: absolute;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--willard-yellow);
            color: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            margin-top: -50px;
            margin-left: -50px;
            font-size: 0.8rem;
            font-family: var(--font-main);
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            transition: visibility 0s, opacity 0.2s linear;
            opacity: 0;
        }

        .pnlm-hotspot-base:hover + .custom-tooltip span {
            visibility: visible;
            opacity: 1;
        }

        /* --- RESPONSIVE ADAPTATIONS --- */
        @media (max-width: 768px) {
            .search-container {
                width: 92%;
                margin-top: 20px;
            }
            .bottom-ui {
                bottom: 20px;
                left: 20px;
                flex-direction: column;
                gap: 10px;
            }
            .hud-glass {
                padding: 10px 15px;
            }
        }
    </style>
</head>

                    "pitch": -6,
                    "yaw": 135, // <-- Positioned 115 degrees right from the landing load view
                    "type": "scene",
                    "text": "Go to Tudisco Hall Back",
                    "sceneId": "tudisco_hall_back"
                }
            ]
        },
        "tudisco_hall_back": {
            "title": "Tudisco Hall Back",
            "keywords": ["tudisco hall back", "hallway", "hall", "back"],
            "hfov": 110,
            "pitch": 0,
            "yaw": 0,
            "type": "equirectangular",
            "panorama": "tudiscoback.JPG", // Make sure this matches your image filename exactly
            "hotSpots": [
                {
                    "pitch": -8,
                    "yaw": 185, // Turns 115 degrees left (360 - 115 = 295) to line back up with the landing
                    "type": "scene",
                    "text": "Return to Top of Stairs Landing",
                    "sceneId": "top_of_stairs"
                }
            ]
        },
        "library": {
            "title": "Willard Library",
            "keywords": ["library", "books", "media center", "studying", "inside"],
            "hfov": 110,
            "pitch": 0,
            "yaw": 0,
            "type": "equirectangular",
            "panorama": "library.JPG", // Make sure this matches your image filename exactly
            "hotSpots": [
                {
                    "pitch": -8,
                    "yaw": 340, // Turns 160 degrees left (360 - 160 = 340) to line back up with the quad exit
                    "type": "scene",
                    "text": "Exit to Main Courtyard",
                    "sceneId": "main_courtyard"
                }
            ]
        }
    };
    
    const sceneExpectations = {
        "upper": "explanation placeholder.",
        "cafeteria": "Cafeteria: Clean up your trash after eating. Return trays to the designated area.",
        "basketball_courts": "placeholder."
    };

    // --- INITIALIZE PANNELLUM ---
    const viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": "telegraph_corner",
            "author": "Jaap_Jaiden_Andres",
            "sceneFadeDuration": 900,
            "autoLoad": true,
            "compass": true,
            "showControls": false, 
            "cubeMapZoom": 1, // <-- PASTE RIGHT HERE FOR RADICAL INSTANT LOADING
            "defaultPitch": 0,    // <-- ADD THIS TO LEVEL THE HORIZON
            "defaultYaw": 0
        },
        "scenes": siteScenes
    });

    // --- FULLSCREEN AUTO-TRIGGER ---
    let hasEnteredFullscreen = false;
    
    function requestFullScreen() {
        if (hasEnteredFullscreen) return;
        const docElm = document.documentElement;
        if (docElm.requestFullscreen) {
            docElm.requestFullscreen().catch(err => console.log("Fullscreen prevented by browser until interaction."));
        } else if (docElm.webkitRequestFullScreen) {
            docElm.webkitRequestFullScreen();
        } else if (docElm.msRequestFullscreen) {
            docElm.msRequestFullscreen();
        }
        hasEnteredFullscreen = true;
    }

    // Attach fullscreen request to first click anywhere on the document
    document.addEventListener('click', requestFullScreen, { once: true });
    document.addEventListener('touchstart', requestFullScreen, { once: true });

    // --- HUD UPDATES ---
    // --- HUD UPDATES & EXPECTATIONS ---
    const seenExpectations = new Set(); // Optional: keeps it from showing every single time
    viewer.on('load', function() {
        const currentScene = viewer.getScene();
        
        // Update HUD
        if(siteScenes[currentScene]) {
            document.getElementById('current-sector-name').innerText = siteScenes[currentScene].title.toUpperCase();
        }

        // Auto-show expectations if they exist for this scene
        if (sceneExpectations[currentScene] && !seenExpectations.has(currentScene)) {
            seenExpectations.add(currentScene); 
            setTimeout(() => {
                openLiquidModal("🏫 AREA EXPECTATIONS", sceneExpectations[currentScene]);
            }, 1000);
        }
    });
    document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth).toFixed(3);
        const y = (e.clientY / window.innerHeight).toFixed(3);
        document.getElementById('coords').innerText = `LAT: ${x} / LON: ${y}`;
    });

    // --- LIQUID GLASS SEARCH ENGINE ---
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    // Generate flat list of search targets
    let searchDatabase = [];
    for (const [sceneId, data] of Object.entries(siteScenes)) {
        // Add the scene itself
        searchDatabase.push({
            type: 'Location',
            title: data.title,
            sceneId: sceneId,
            matchTerms: data.title.toLowerCase()
        });

        // Add individuals/keywords associated with the scene
        if (data.keywords) {
            data.keywords.forEach(kw => {
                searchDatabase.push({
                    type: 'Tag',
                    title: kw.replace(/\b\w/g, l => l.toUpperCase()), // Title case
                    subtitle: `Located in ${data.title}`,
                    sceneId: sceneId,
                    matchTerms: kw.toLowerCase()
                });
            });
        }
    }

    function renderResults(query) {
        searchResults.innerHTML = '';
        if (!query) {
            searchResults.classList.remove('active');
            return;
        }

        const q = query.toLowerCase();
        // Filter database
        const matches = searchDatabase.filter(item => item.matchTerms.includes(q));

        if (matches.length === 0) {
            searchResults.innerHTML = `<div class="no-results">No locations or teachers found for "${query}"</div>`;
            searchResults.classList.add('active');
            return;
        }

        // De-duplicate matches pointing to the same scene + title combo
        const uniqueMatches = [];
        const seen = new Set();
        matches.forEach(m => {
            const id = m.title + m.sceneId;
            if (!seen.has(id)) {
                seen.add(id);
                uniqueMatches.push(m);
            }
        });

        // Limit to top 5 results
        uniqueMatches.slice(0, 5).forEach(match => {
            const item = document.createElement('div');
            item.className = 'result-item';
            
            // Icon (Map Pin SVG)
            const iconSvg = `<svg class="result-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;
            
            let html = `${iconSvg}<div class="result-details">
                            <span class="result-title">${match.title}</span>`;
            
            if (match.subtitle) {
                html += `<span class="result-subtitle">${match.subtitle}</span>`;
            } else {
                html += `<span class="result-subtitle">SECTOR</span>`;
            }
            html += `</div>`;
            
            item.innerHTML = html;

            // Click handler for routing
            // Click handler for routing
            item.addEventListener('click', () => {
                requestFullScreen(); // Ensure fullscreen
                // Fixes the tilt by forcing pitch to 0 and yaw to 0 on every transition!
                viewer.loadScene(match.sceneId, 0, 0, 110);
                searchInput.value = ''; // Clear input
                searchResults.classList.remove('active'); // Hide dropdown
                searchInput.blur(); // Remove focus
            });

            searchResults.appendChild(item);
        });

        searchResults.classList.add('active');
    }

    searchInput.addEventListener('input', (e) => {
        renderResults(e.target.value.trim());
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) {
            searchResults.classList.remove('active');
        }
    });

    // Re-open if clicking input with text
    searchInput.addEventListener('focus', (e) => {
        if (e.target.value.trim().length > 0) {
            searchResults.classList.add('active');
        }
    });

    // STEM Feature: Keyboard controls
    document.addEventListener('keydown', (e) => {
        if(e.key === 'f') {
            viewer.toggleFullscreen();
        }
    });
    
    function openLiquidModal(title, body) {
        document.getElementById('modal-title').innerHTML = title;
        document.getElementById('modal-body').innerHTML = body;
        document.getElementById('liquid-modal').style.display = 'block';
    }
    

</script>
</body>
</html>
